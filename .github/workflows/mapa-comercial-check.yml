name: Mapa Comercial Check

on:
  pull_request:
    paths:
      - "mapa-comissoes/**"
  push:
    branches:
      - main
    paths:
      - "mapa-comissoes/**"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check calculation engine
        run: node --check mapa-comissoes/engine.js
      - name: Check application
        run: node --check mapa-comissoes/app.js
      - name: Run calculation regression tests
        run: node mapa-comissoes/engine.test.js
      - name: Run UI contract tests
        run: node mapa-comissoes/ui-contract.test.js
      - name: Verify critical production hooks
        run: |
          grep -q 'id="authGate"' mapa-comissoes/index.html
          grep -q 'id="dealSaveButton"' mapa-comissoes/index.html
          grep -q 'SUPABASE_URL' mapa-comissoes/app.js
          grep -q 'save_configuration' mapa-comissoes/app.js
          grep -q 'id="view-presentation"' mapa-comissoes/index.html
          grep -q 'id="btnAddTier"' mapa-comissoes/index.html
          grep -q 'data-confirm-deal' mapa-comissoes/app.js
